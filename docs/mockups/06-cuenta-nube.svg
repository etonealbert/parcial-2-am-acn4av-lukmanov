<svg xmlns="http://www.w3.org/2000/svg" width="900" height="790" viewBox="0 0 900 790" role="img" aria-label="Mockup: Cuenta y nube (Firebase)"><title>Mockup: Cuenta y nube (Firebase)</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A5E55"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.18"/></filter></defs><text x="240.0" y="36" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#5A5E55" text-anchor="middle">Estado actual: sin google-services.json</text><rect x="52" y="46" width="376" height="728" rx="30" fill="#2B2D27" filter="url(#shadow)"/><clipPath id="clip6050"><rect x="60" y="50" width="360" height="720" rx="24"/></clipPath><g clip-path="url(#clip6050)"><rect x="60" y="50" width="360" height="720" rx="0" fill="#F6F7F3"/><text x="80" y="68" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1A1C14" text-anchor="start">12:30</text><rect x="368" y="58" width="32" height="10" rx="2" fill="none" stroke="#1A1C14" stroke-width="1.2"/><rect x="370" y="60" width="22" height="6" rx="1" fill="#1A1C14"/><path d="M20,11H7.83l5.59,-5.59L12,4l-8,8 8,8 1.41,-1.41L7.83,13H20v-2z" fill="#1A1C14" transform="translate(76 90) scale(1.0000)"/><text x="132" y="109" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A1C14" text-anchor="start">Cuenta y nube</text><path d="M19.35,10.04C18.67,6.59 15.64,4 12,4 9.11,4 6.6,5.64 5.35,8.04 2.34,8.36 0,10.91 0,14c0,3.31 2.69,6 6,6h13c2.76,0 5,-2.24 5,-5 0,-2.64 -2.05,-4.78 -4.65,-4.96zM14,13v4h-4v-4H7l5,-5 5,5h-3z" fill="#4C7D00" transform="translate(76 146) scale(2.3333)"/><text x="148" y="160" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1A1C14" text-anchor="start">Opcional: creá una cuenta para respaldar</text><text x="148" y="178" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1A1C14" text-anchor="start">tus series en la nube con Firebase. La</text><text x="148" y="196" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1A1C14" text-anchor="start">app funciona igual sin cuenta.</text><rect x="76" y="234" width="328" height="170" rx="16" fill="#EAF5C8"/><path d="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zM13,17h-2v-6h2v6zM13,9h-2V7h2v2z" fill="#1A1C14" transform="translate(92 250) scale(1.0000)"/><text x="124" y="268" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1A1C14" text-anchor="start">Firebase todavía no está configurado</text><text x="92" y="298" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1A1C14" text-anchor="start">Esta compilación no incluye el archivo</text><text x="92" y="317" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1A1C14" text-anchor="start">google-services.json, así que el inicio de</text><text x="92" y="336" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1A1C14" text-anchor="start">sesión y el respaldo están desactivados. Los</text><text x="92" y="355" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1A1C14" text-anchor="start">pasos para activarlo están en</text><text x="92" y="374" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1A1C14" text-anchor="start">docs/FIREBASE.md del repositorio.</text><text x="76" y="430" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A5E55" text-anchor="start" font-style="italic">El resto de la app (registro, historial, guía,</text><text x="76" y="446" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A5E55" text-anchor="start" font-style="italic">ajustes) funciona normalmente.</text><text x="76" y="700" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A5E55" text-anchor="start">Solo se suben tus series (ejercicio, repeticiones</text><text x="76" y="716" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A5E55" text-anchor="start">y fecha) a tu espacio privado en Firestore.</text><rect x="186.0" y="760" width="108" height="4" rx="2" fill="#1A1C14"/></g><text x="660.0" y="36" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#5A5E55" text-anchor="middle">Con Firebase configurado (sesión iniciada)</text><rect x="472" y="46" width="376" height="728" rx="30" fill="#2B2D27" filter="url(#shadow)"/><clipPath id="clip48050"><rect x="480" y="50" width="360" height="720" rx="24"/></clipPath><g clip-path="url(#clip48050)"><rect x="480" y="50" width="360" height="720" rx="0" fill="#F6F7F3"/><text x="500" y="68" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1A1C14" text-anchor="start">12:30</text><rect x="788" y="58" width="32" height="10" rx="2" fill="none" stroke="#1A1C14" stroke-width="1.2"/><rect x="790" y="60" width="22" height="6" rx="1" fill="#1A1C14"/><path d="M20,11H7.83l5.59,-5.59L12,4l-8,8 8,8 1.41,-1.41L7.83,13H20v-2z" fill="#1A1C14" transform="translate(496 90) scale(1.0000)"/><text x="552" y="109" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A1C14" text-anchor="start">Cuenta y nube</text><path d="M19.35,10.04C18.67,6.59 15.64,4 12,4 9.11,4 6.6,5.64 5.35,8.04 2.34,8.36 0,10.91 0,14c0,3.31 2.69,6 6,6h13c2.76,0 5,-2.24 5,-5 0,-2.64 -2.05,-4.78 -4.65,-4.96zM14,13v4h-4v-4H7l5,-5 5,5h-3z" fill="#4C7D00" transform="translate(496 146) scale(2.3333)"/><text x="568" y="160" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1A1C14" text-anchor="start">Opcional: creá una cuenta para respaldar</text><text x="568" y="178" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1A1C14" text-anchor="start">tus series en la nube con Firebase. La</text><text x="568" y="196" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1A1C14" text-anchor="start">app funciona igual sin cuenta.</text><path d="M12,12c2.21,0 4,-1.79 4,-4s-1.79,-4 -4,-4 -4,1.79 -4,4 1.79,4 4,4zM12,14c-2.67,0 -8,1.34 -8,4v2h16v-2c0,-2.66 -5.33,-4 -8,-4z" fill="#4C7D00" transform="translate(496 234) scale(1.0000)"/><text x="528" y="252" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1A1C14" text-anchor="start">Sesión iniciada: albert@example.com</text><text x="496" y="282" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5A5E55" text-anchor="start">Último respaldo: Martes, 17 de noviembre ·</text><text x="496" y="301" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5A5E55" text-anchor="start">12:30 (64 series)</text><rect x="496" y="330" width="328" height="52" rx="26.0" fill="#4C7D00"/><path d="M19.35,10.04C18.67,6.59 15.64,4 12,4 9.11,4 6.6,5.64 5.35,8.04 2.34,8.36 0,10.91 0,14c0,3.31 2.69,6 6,6h13c2.76,0 5,-2.24 5,-5 0,-2.64 -2.05,-4.78 -4.65,-4.96zM14,13v4h-4v-4H7l5,-5 5,5h-3z" fill="#FFFFFF" transform="translate(539.75 347.0) scale(0.7500)"/><text x="565.75" y="361.4" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="start">Respaldar mis series ahora</text><path d="M17,7l-1.41,1.41L18.17,11H8v2h10.17l-2.58,2.58L17,17l5,-5zM4,5h8V3H4c-1.1,0 -2,0.9 -2,2v14c0,1.1 0.9,2 2,2h8v-2H4V5z" fill="#4C7D00" transform="translate(596.95 403.0) scale(0.7500)"/><text x="622.95" y="417.04" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#4C7D00" text-anchor="start">Cerrar sesión</text><text x="496" y="460" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1A1C14" text-anchor="start">Respaldo completo: 64 series en la nube.</text><text x="496" y="488" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A5E55" text-anchor="start" font-style="italic">Formulario sin sesión: Email, Contraseña (con</text><text x="496" y="504" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A5E55" text-anchor="start" font-style="italic">botón mostrar/ocultar), «Iniciar sesión» y</text><text x="496" y="520" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A5E55" text-anchor="start" font-style="italic">«Crear cuenta», con validación de campos.</text><text x="496" y="700" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A5E55" text-anchor="start">Solo se suben tus series (ejercicio, repeticiones</text><text x="496" y="716" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A5E55" text-anchor="start">y fecha) a tu espacio privado en Firestore.</text><rect x="606.0" y="760" width="108" height="4" rx="2" fill="#1A1C14"/></g></svg>
